# Touchpad: natuerliches Scrollen (Inhalt folgt den Fingern, wie unter macOS)
# und Tap-to-Click (Tippen klickt, ohne das Pad durchzudruecken)
Section "InputClass"
    Identifier "touchpad natural scrolling"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "NaturalScrolling" "true"
    Option "Tapping" "true"
    Option "TappingButtonMap" "lrm"

    # Beide Optionen stehen hier, weil Antipper sonst spuerbar verzoegert
    # ankommen -- am deutlichsten beim Klick auf die Statusleiste.
    #
    # TappingDrag "false": mit "true" haelt libinput nach jedem Antippen rund
    # 180 ms den Knopf gedrueckt und wartet ab, ob ein Ziehen daraus wird.
    # Gebraucht wird das nur, wenn man Fenster durch Antippen-und-Ziehen
    # verschiebt; verschoben wird hier per $mod+Maus (floating_modifier).
    Option "TappingDrag" "false"

    # DisableWhileTyping "false": mit "true" (der Vorgabe) ignoriert libinput
    # das Touchpad noch etwa eine halbe Sekunde nach dem letzten Tastendruck.
    # Physische Klicks kommen dabei durch, Antipper nicht -- wer also tippt
    # und dann gleich auf die Leiste tippt, klickt ins Leere. Gegen wandernde
    # Zeiger beim Tippen bleibt die Handballenerkennung von libinput aktiv,
    # die ist davon unabhaengig. Springt der Zeiger doch: wieder auf "true".
    Option "DisableWhileTyping" "false"
EndSection
