# ~/.config/glances/glances.conf -- Grundkonfiguration fuers Vitals-Dashboard.
#
# glances liest genau EINE Konfigurationsdatei: die erste, die es findet,
# oder die per --config uebergebene. Was hier fehlt, faellt auf die
# eingebauten Vorgaben zurueck, nicht auf die Beispieldatei unter
# /usr/share/examples/glances/glances.conf.
#
# Diese Datei benutzt der Pane "Datentraeger". Die beiden Sensor-Panes
# haben eigene Dateien daneben (sensoren-cpu.conf, sensoren-system.conf),
# weil "show" und "hide" pro Abschnitt gelten und sich sonst nicht
# unterschiedlich filtern liessen.

[fs]
# Vorgabe waere "hide=/boot.*,.*/snap.*" -- damit verschwand die
# EFI-Partition aus der Liste. snap gibt es auf Void ohnehin nicht.
hide=
alias=/:System,/boot/efi:EFI

[diskio]
# Nur das ganze Geraet, nicht zusaetzlich jede einzelne Partition -- und
# nicht die acht leeren loop-Geraete, die der Kernel immer bereithaelt.
hide=nvme0n1p.*,loop.*
alias=nvme0n1:SSD
