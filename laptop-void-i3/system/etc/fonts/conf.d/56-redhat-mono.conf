<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "../fonts.dtd">
<!-- /etc/fonts/conf.d/56-redhat-mono.conf

     Red Hat Mono als generische Monospace-Schrift des Systems.

     Die Nummer 56 ist wichtig: 57-dejavu-sans-mono.conf setzt DejaVu Sans Mono
     als monospace. <prefer> stellt voran, und die zuerst geladene Datei
     gewinnt. Diese Datei muss also VOR der 57er liegen.

     Achtung beim Editieren: zwei Minuszeichen hintereinander sind in einem
     XML-Kommentar verboten und legen die ganze Datei still lahm.
-->
<fontconfig>

  <!-- Generisches "monospace" auf Red Hat Mono.
       Alles, was nicht ausdruecklich eine Familie nennt (Firefox-Codebloecke,
       GTK-Textwidgets, Pango-Defaults), landet damit hier. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Red Hat Mono</family>
    </prefer>
  </alias>

  <!-- Red Hat Mono meldet sich selbst als monospace an. -->
  <alias>
    <family>Red Hat Mono</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <!-- Kern gegen den "faellt doch wieder zurueck"-Effekt:
       Red Hat Mono hat weder Nerd-Font-Icons noch CJK. Ohne diese Regel kann
       fontconfig bei einem fehlenden Zeichen die ganze Anfrage verwerfen und
       DejaVu liefern. Mit den angehaengten Familien wird nur das EINZELNE
       fehlende Zeichen woanders geholt, der Rest bleibt Red Hat Mono.
       binding="weak", damit eine explizite Wahl in einer App-Config
       weiterhin Vorrang hat. -->
  <match target="pattern">
    <test name="family"><string>Red Hat Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK JP</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

</fontconfig>
