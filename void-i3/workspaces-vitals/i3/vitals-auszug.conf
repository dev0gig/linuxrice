# Die Zeilen aus ~/.config/i3/config, die zum Vitals-Dashboard gehoeren.
# In die eigene i3-Config uebernehmen, dann "i3-msg restart".

# Eine eigene Fensterklasse, damit NUR dieses Fenster auf Arbeitsflaeche 4
# wandert -- normal gestartete Alacritty-Fenster bleiben unberuehrt.
#
# Wichtig das Schluesselwort "number": wer seine Arbeitsflaechen umbenennt
# (etwa auf "4: Vitals"), bei dem wuerde i3 ohne "number" den Namen exakt
# gegen "4" pruefen, keinen Treffer finden und eine zweite, gleichnamige
# Flaeche danebenlegen.
assign [class="vitals-dashboard"] number 4

exec --no-startup-id alacritty --class vitals-dashboard -e $HOME/.local/bin/vitals

# Das Dashboard soll die volle Flaeche haben: kein Rahmen, keine Titelleiste.
for_window [class="vitals-dashboard"] border none
