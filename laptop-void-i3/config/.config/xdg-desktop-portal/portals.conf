# Unter i3 ist XDG_CURRENT_DESKTOP nicht gesetzt, darum weiss xdg-desktop-portal
# nicht, welches Backend es nehmen soll (gtk.portal hat "UseIn=gnome").
# Ohne Backend oeffnen Flatpak-Apps (VS Code, Chrome, Brave) keine externen
# Links -- der "Sign in"-Klick in VS Code verpufft dann lautlos.
[preferred]
default=gtk
