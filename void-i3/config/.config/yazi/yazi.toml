# Yazi -- Dateimanager im Terminal.
# Bedienung geht komplett mit den Cursortasten: hoch/runter bewegen,
# rechts oeffnet den Ordner, links geht wieder zurueck. hjkl liegt parallel
# darauf, muss man aber nicht benutzen.

[mgr]
# Maus einschalten: Klicken zum Auswaehlen, Scrollen im Rad.
mouse_events = ["click", "scroll"]
show_hidden = false
sort_by = "natural"
sort_dir_first = true
linemode = "size"

[preview]
max_width = 600
max_height = 900

[opener]
# Enter auf einer Textdatei startet Helix in einem EIGENEN Alacritty-Fenster,
# nicht im Yazi-Fenster.  Yazis Vorgabe dafuer ist
#     { run = "${EDITOR:-vi} %s", block = true }
# -- "block" heisst: Yazi haelt an und der Editor uebernimmt das Terminal, der
# Dateimanager verschwindet also dahinter.  Ein eigenes Fenster kachelt i3
# dagegen von selbst daneben: Yazi links, Helix rechts.
#
# orphan = true ist das Gegenstueck zu block: Yazi wartet nicht auf das Ende
# des Editors und bleibt sofort wieder bedienbar.
#
# %s ist der Platzhalter DIESER Yazi-Version fuer die ausgewaehlten Dateien.
# Aeltere Anleitungen im Netz schreiben "$@" -- das bleibt hier wirkungslos.
#
# Der Name "edit" ist nicht frei gewaehlt: die eingebauten Regeln schicken
# text/*, JSON und leere Dateien an genau diesen Opener.
edit = [
	{ run = 'alacritty --class helix-term -e hx %s', desc = "Helix im eigenen Fenster", for = "unix", orphan = true },
]
