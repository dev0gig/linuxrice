# libinput-gestures - Touchpad-Gesten
# Doku: man libinput-gestures / /etc/libinput-gestures.conf
#
# 3 Finger wischen = Arbeitsflaeche wechseln.
# Richtung wie unter macOS: nach links wischen -> naechste Arbeitsflaeche.

gesture swipe left  3  i3-msg workspace next
gesture swipe right 3  i3-msg workspace prev
