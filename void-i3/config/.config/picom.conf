# picom - Compositor fuer Terminal-Transparenz und das Arbeitsflaechen-Karussell.
# Kein Fade, keine Schatten, keine Rundungen.
backend = "glx";
vsync = true;

fading = false;
shadow = false;
corner-radius = 0;

# Transparenz kommt aus alacritty selbst (window.opacity), picom muss nur als
# Compositor laufen. Keine eigenen opacity-Regeln noetig.

# Arbeitsflaechen-Wechsel als Karussell.
# i3 un-/mapped die Fenster beim Wechsel, picom animiert das als hide/show:
# alte Fenster fliegen zur Seite raus, neue kommen von der Gegenseite rein.
# Die Richtung steht in der X-Property _SWIPE_DIR auf dem i3-Rahmenfenster,
# die ~/.local/bin/ws-swipe vor jedem Wechsel schreibt (picom 13 hat keine
# Arbeitsflaechen-Trigger). Fenster ohne die Property werden nicht animiert.
# Bei fly-in heisst direction "kommt von dieser Seite", bei fly-out "geht
# zu dieser Seite" -- deshalb stehen pro Regel zwei verschiedene Richtungen.
# Beim Reinfliegen steht neben "show" auch "open": Fenster, die beim Start
# oder beim Neuladen von picom gerade auf einer anderen Flaeche liegen, meldet
# picom beim naechsten Auftauchen als "open" statt als "show" -- sie waeren
# sonst genau einmal ohne Animation da. Frisch geoeffnete Fenster stoert das
# nicht: die bekommen einen neuen i3-Rahmen, und der hat noch kein _SWIPE_DIR.
rules = (
  {
    match = "_SWIPE_DIR = 'left'";
    animations = (
      { triggers = ["hide"]; preset = "fly-out"; direction = "left";  duration = 0.10; },
      { triggers = ["show", "open"]; preset = "fly-in";  direction = "right"; duration = 0.10; }
    );
  },
  {
    match = "_SWIPE_DIR = 'right'";
    animations = (
      { triggers = ["hide"]; preset = "fly-out"; direction = "right"; duration = 0.10; },
      { triggers = ["show", "open"]; preset = "fly-in";  direction = "left";  duration = 0.10; }
    );
  },
  {
    # Benachrichtigungen fliegen von oben rein und nach oben wieder weg.
    # Warum alle vier Trigger dranstehen: dunst haelt EIN Fenster und
    # mapped/unmapped es nur. picom meldet das erste Mappen nach dem Start
    # als "open", jedes weitere als "show" -- deshalb muessen beide beim
    # Reinfliegen stehen, sonst fliegt nur die allererste Meldung. Beim
    # Verschwinden ist es "hide"; "close" kommt nur, wenn dunst selbst endet.
    # Nachgemessen im Debug-Log von picom 13.
    # Mehrere Meldungen gleichzeitig zeichnet dunst in dasselbe Fenster, es
    # wird nur groesser -- geflogen wird also einmal am Anfang und einmal am
    # Ende, nicht pro Meldung. Dasselbe gilt fuer das OSD: solange F7 die
    # stehende Meldung ersetzt, bleibt das Fenster gemappt.
    match = "class_g = 'Dunst'";
    animations = (
      { triggers = ["open", "show"];  preset = "fly-in";  direction = "up"; duration = 0.15; },
      { triggers = ["hide", "close"]; preset = "fly-out"; direction = "up"; duration = 0.15; }
    );
  }
);
