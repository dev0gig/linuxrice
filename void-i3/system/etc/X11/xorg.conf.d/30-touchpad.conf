# Touchpad: natuerliches Scrollen (Inhalt folgt den Fingern, wie unter macOS)
# und Tap-to-Click (Tippen klickt, ohne das Pad durchzudruecken)
Section "InputClass"
    Identifier "touchpad natural scrolling"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "NaturalScrolling" "true"
    Option "Tapping" "true"
    Option "TappingButtonMap" "lrm"

    # TappingDrag "true": antippen, den Finger sofort wieder aufsetzen und
    # ziehen -- der Knopf bleibt dabei gedrueckt. So laesst sich zusammen mit
    # $mod (floating_modifier) ein Fenster ohne physisches Durchdruecken
    # verschieben. Preis dafuer: libinput haelt nach jedem Antippen rund
    # 180 ms den Knopf gedrueckt und wartet ab, ob ein Ziehen daraus wird --
    # einfache Antipper kommen dadurch spuerbar verzoegert an, am deutlichsten
    # beim Klick auf die Statusleiste. Wer die Verzoegerung nicht will, setzt
    # beide folgenden Optionen wieder auf "false".
    Option "TappingDrag" "true"

    # TappingDragLock "true": beim Ziehen darf der Finger zwischendurch
    # abheben (nachfassen am Pad-Rand), der Knopf bleibt trotzdem gedrueckt.
    # Losgelassen wird erst durch ein kurzes Antippen -- oder von selbst,
    # wenn der Finger laenger als die Tap-Zeit weg bleibt.
    Option "TappingDragLock" "true"

    # DisableWhileTyping "false": mit "true" (der Vorgabe) ignoriert libinput
    # das Touchpad noch etwa eine halbe Sekunde nach dem letzten Tastendruck.
    # Physische Klicks kommen dabei durch, Antipper nicht -- wer also tippt
    # und dann gleich auf die Leiste tippt, klickt ins Leere. Gegen wandernde
    # Zeiger beim Tippen bleibt die Handballenerkennung von libinput aktiv,
    # die ist davon unabhaengig. Springt der Zeiger doch: wieder auf "true".
    Option "DisableWhileTyping" "false"
EndSection
