# Rechte Sensorspalte: alles ausser den CPU-Kernen -- SSD, WLAN,
# Luefter, Akku.
#
# acpitz ist raus: die beiden ACPI-Zonen melden auf diesem Geraet 27 und
# 10 Grad und sagen damit nichts Brauchbares aus.
[sensors]
hide=core .*,package id .*,acpitz.*
alias=core 0:Kern 0,core 1:Kern 1,core 2:Kern 2,core 3:Kern 3,package id 0:CPU gesamt,composite:SSD,sensor 1:SSD 1,sensor 2:SSD 2,iwlwifi_1 0:WLAN,hp 0:Luefter 1,hp 1:Luefter 2,battery:Akku
