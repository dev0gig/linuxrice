# picom - nur fuer Terminal-Transparenz, sonst nichts.
# Keine Animationen, kein Fade, keine Schatten, keine Rundungen.
backend = "glx";
vsync = true;

fading = false;
shadow = false;
corner-radius = 0;

# Transparenz kommt aus alacritty selbst (window.opacity = 0.8),
# picom muss nur als Compositor laufen. Keine eigenen opacity-Regeln noetig.
